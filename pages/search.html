<div class="search-page">
  <div class="search-box">
    <input 
      type="search" 
      id="pagefind-search" 
      placeholder="Search lectures, speakers, topics..." 
      class="search-input-large"
      autofocus
    >
  </div>
  
  <div id="search-results" class="search-results">
    <!-- Results will be inserted here -->
  </div>
  
  <div id="search-empty" class="search-empty" style="display: none;">
    <p>No results found. Try different keywords.</p>
  </div>
</div>

<style>
.search-page {
  max-width: 800px;
  margin: 0 auto;
}

.search-box {
  margin-bottom: var(--spacing-xl);
}

.search-input-large {
  width: 100%;
  padding: var(--spacing-md) var(--spacing-lg);
  font-size: 1.25rem;
  border: 2px solid var(--color-border);
  border-radius: var(--border-radius);
  transition: border-color 0.2s ease;
}

.search-input-large:focus {
  outline: none;
  border-color: var(--color-science);
}

.search-results {
  margin-top: var(--spacing-lg);
}

.search-result {
  padding: var(--spacing-md);
  margin-bottom: var(--spacing-md);
  background: var(--color-background-alt);
  border-radius: var(--border-radius);
  transition: all 0.2s ease;
}

.search-result:hover {
  background: white;
  box-shadow: var(--shadow);
}

.search-result-title {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: var(--spacing-xs);
}

.search-result-title a {
  color: var(--color-text);
}

.search-result-title a:hover {
  color: var(--color-science);
}

.search-result-excerpt {
  color: var(--color-text-light);
  line-height: 1.6;
}

.search-result-excerpt mark {
  background: #fff3cd;
  padding: 2px 4px;
  border-radius: 2px;
}

.search-empty {
  text-align: center;
  padding: var(--spacing-xxl);
  color: var(--color-text-light);
}
</style>

<!-- Pagefind Search Integration -->
<link href="{{ site.baseurl }}/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="{{ site.baseurl }}/pagefind/pagefind-ui.js"></script>
<script>
  window.__BASEURL__ = "{{ site.baseurl }}";
</script>
