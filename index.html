---
layout: default
---

<!-- Statistics -->
<section class="stats">
  <div class="container">
    <div class="stats-grid" id="stats-grid">
      <div class="stat">
        <div class="stat-number" id="lecture-count">15,847</div>
        <div class="stat-label">Lectures</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="speaker-count">16,912</div>
        <div class="stat-label">Speakers</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="topic-count">4,463</div>
        <div class="stat-label">Topics</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="institution-count">3,459</div>
        <div class="stat-label">Institutions</div>
      </div>
    </div>
  </div>
</section>

<!-- Highlights: Editor's Pick / Today / This Week -->
<section class="highlights">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Highlights</h2>
    </div>
    <div id="highlights-grid" class="highlights-grid">
      <p>Loading highlights...</p>
    </div>
  </div>
  
</section>

<!-- Supercategories -->
<section class="supercategories">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Browse by Category</h2>
      <a href="{{ '/browse/' | relative_url }}" class="section-link">View All →</a>
    </div>
    
    <div class="category-grid" id="category-grid">
      <!-- Categories will be loaded here -->
      <p>Loading categories...</p>
    </div>
  </div>
</section>

<!-- Recent Lectures -->
<section class="recent-lectures">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Recently Added</h2>
      <a href="{{ '/browse/' | relative_url }}" class="section-link">Browse All →</a>
    </div>
    
    <div class="lecture-grid" id="recent-lectures">
      <p>Loading lectures...</p>
    </div>
  </div>
</section>

<script>
// Load summary data and recent lectures
(function() {
  const categories = [
    { slug: 'science', name: 'Science', count: 0 },
    { slug: 'arts', name: 'Arts', count: 0 },
    { slug: 'politics', name: 'Politics', count: 0 },
    { slug: 'business', name: 'Business', count: 0 },
    { slug: 'music', name: 'Music', count: 0 },
    { slug: 'religion', name: 'Religion', count: 0 },
    { slug: 'academic', name: 'Academic', count: 0 },
    { slug: 'sport', name: 'Sport', count: 0 },
    { slug: 'society', name: 'Society', count: 0 },
    { slug: 'children', name: 'Children', count: 0 },
    { slug: 'leisure', name: 'Leisure', count: 0 }
  ];
  
  // Render categories immediately with default counts; will update after summary loads
  renderCategories();
  
  // Load summary stats
  fetch('{{ site.baseurl }}/assets/data/summary.json')
    .then(response => response.json())
    .then(summary => {
      // Stats section is optional; guard in case it's removed from the page
      const lc = document.getElementById('lecture-count');
      const sc = document.getElementById('speaker-count');
      const tc = document.getElementById('topic-count');
      const ic = document.getElementById('institution-count');
      if (lc) lc.textContent = summary.total_lectures.toLocaleString();
      if (sc) sc.textContent = summary.total_speakers.toLocaleString();
      if (tc) tc.textContent = summary.total_topics.toLocaleString();
      if (ic) ic.textContent = summary.total_institutions.toLocaleString();
      

    // Update category counts
    if (summary.by_supercategory) {
      categories.forEach(cat => {
        if (summary.by_supercategory[cat.slug]) {
          cat.count = summary.by_supercategory[cat.slug];
        }
      });
    }
      
      renderCategories();
    })
    .catch(error => {
      console.error('Error loading summary:', error);
      // Ensure categories still render even if summary fetch or DOM updates fail
      renderCategories();
    });
  
  // Load recent lectures: prefer small precomputed view_recents.json
  // Fallback to legacy lectures.json if missing or ?legacy=1 present
  (function loadRecents() {
    const params = new URLSearchParams(window.location.search);
    const forceLegacy = params.get('legacy') === '1';

    if (!forceLegacy) {
      fetch('{{ site.baseurl }}/assets/data/view_recents.json')
        .then(resp => (resp.ok ? resp.json() : Promise.reject(new Error('view_recents missing'))))
        .then(recents => {
          // Already sorted server-side; just take top 6 to display
          renderRecentLectures(recents.slice(0, 10));
        })
        .catch(() => {
          // Fallback: legacy path using full lectures.json
          fetch('{{ site.baseurl }}/assets/data/lectures.json')
            .then(response => response.json())
            .then(lectures => {
              const recent = lectures
                .sort((a, b) => new Date(b.date || b.added) - new Date(a.date || a.added))
                .slice(0, 10);
              renderRecentLectures(recent);
            })
            .catch(error => {
              console.error('Error loading lectures (fallback):', error);
              document.getElementById('recent-lectures').innerHTML = '<p>Error loading lectures.</p>';
            });
        });
    } else {
      fetch('{{ site.baseurl }}/assets/data/lectures.json')
        .then(response => response.json())
        .then(lectures => {
          const recent = lectures
            .sort((a, b) => new Date(b.date || b.added) - new Date(a.date || a.added))
            .slice(0, 10);
          renderRecentLectures(recent);
        })
        .catch(error => {
          console.error('Error loading lectures (legacy):', error);
          document.getElementById('recent-lectures').innerHTML = '<p>Error loading lectures.</p>';
        });
    }
  })();
  
  function renderCategories() {
    const html = categories.map(cat => `
      <a href="{{ site.baseurl }}/browse/?category=${cat.slug}" class="category-card">
        <div class="category-image">
          <img src="{{ site.baseurl }}/assets/images/supercategories/${cat.slug}.webp" 
               alt="${cat.name}"
               onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, var(--color-${cat.slug}), var(--color-${cat.slug}-light))';">
        </div>
        <div class="category-content">
          <h3 class="category-name">${cat.name}</h3>
          <p class="category-count">${cat.count > 0 ? cat.count.toLocaleString() + ' lectures' : 'View lectures'}</p>
        </div>
      </a>
    `).join('');
    
    document.getElementById('category-grid').innerHTML = html;
  }
  
  function renderRecentLectures(lectures) {
    const html = lectures.map(lecture => {
      const speakers = lecture.speakers.slice(0, 2).map(s => s.name).join(', ');
      const moreCount = lecture.speakers.length > 2 ? ` +${lecture.speakers.length - 2}` : '';
      
      return `
        <div class="lecture-card">
          <div class="lecture-card-image" style="background: linear-gradient(135deg, var(--color-${lecture.supercategory}), var(--color-${lecture.supercategory}-light));">
            ${lecture.image_id ? `<img src="{{ '/assets/images/sm/' | relative_url }}${lecture.image_id}.webp" alt="${lecture.title}" onerror="this.style.display='none'">` : ''}
            <span class="lecture-card-category">${lecture.supercategory}</span>
          </div>
          <div class="lecture-card-content">
            <h3 class="lecture-card-title">
              <a href="{{ '/lecture/' | relative_url }}?slug=${lecture.slug}">${lecture.title}</a>
            </h3>
            ${speakers ? `<div class="lecture-card-speakers">${speakers}${moreCount}</div>` : ''}
            ${lecture.synopsis ? `<p class="lecture-card-synopsis">${lecture.synopsis.substring(0, 120)}...</p>` : ''}
            <div class="lecture-card-meta">
              <span>${new Date(lecture.date || lecture.added).toLocaleDateString()}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
    
    document.getElementById('recent-lectures').innerHTML = html;
  }
})();

// Load and render homepage highlights (Editor's Pick, Today, This Week)
(function() {
  const highlightsGrid = document.getElementById('highlights-grid');
  if (!highlightsGrid) return;

  const siteDemoNow = "{{ site.demo_now | default: '' }}".trim();

  // Resolve the demo clock: URL param `now=YYYY-MM-DD` > site.demo_now > real now
  function getNowDate() {
    const params = new URLSearchParams(window.location.search);
    const override = params.get('now');
    const pick = (override && /^\d{4}-\d{2}-\d{2}$/.test(override)) ? override
                : (siteDemoNow && /^\d{4}-\d{2}-\d{2}$/.test(siteDemoNow)) ? siteDemoNow
                : null;
    return pick ? new Date(pick + 'T00:00:00') : new Date();
  }

  function parseDate(iso) {
    if (!iso) return null;
    // Ensure UTC-like parsing to avoid TZ shifts
    const m = /^([0-9]{4})-([0-9]{2})-([0-9]{2})$/.exec(iso);
    if (!m) return null;
    const y = +m[1], mo = +m[2]-1, d = +m[3];
    const dt = new Date(Date.UTC(y, mo, d));
    return { y, m: mo+1, d, dt };
  }

  function dayOfYear(m, d, y) {
    // y optional: use non-leap assumption unless validating Feb 29
    const yy = y || 2001; // non-leap
    const date = new Date(Date.UTC(yy, m-1, d));
    const start = new Date(Date.UTC(yy, 0, 1));
    return Math.floor((date - start) / 86400000) + 1;
  }

  function weekWindow(now) {
    const dow = now.getUTCDay(); // 0=Sun
    const diffToMon = (dow + 6) % 7; // days since Monday
    const start = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - diffToMon));
    const end = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), start.getUTCDate() + 6));
    return { start, end };
  }

  function inWeekByMonthDay(lectureMD, window, year) {
    // Map the lecture month/day into the current year and test in-range
    const mapped = new Date(Date.UTC(year, lectureMD.m-1, lectureMD.d));
    return mapped >= window.start && mapped <= window.end;
  }

  function pickToday(lectures, now, curatedSlug) {
    const nowMD = { m: now.getUTCMonth() + 1, d: now.getUTCDate() };
    if (curatedSlug && lectures.bySlug[curatedSlug]) return lectures.bySlug[curatedSlug];

    const sameMD = lectures.list
      .filter(l => l.dateParts && l.dateParts.m === nowMD.m && l.dateParts.d === nowMD.d)
      .sort((a,b) => (b.dateParts?.y||0) - (a.dateParts?.y||0));
    if (sameMD.length) return sameMD[0];

    // Nearest month/day by absolute day-of-year distance (wrap-aware)
    const target = dayOfYear(nowMD.m, nowMD.d);
    let best = null, bestDist = Infinity;
    for (const l of lectures.list) {
      if (!l.dateParts) continue;
      const doy = dayOfYear(l.dateParts.m, l.dateParts.d);
      const dist = Math.min(Math.abs(doy - target), 365 - Math.abs(doy - target));
      if (dist < bestDist) { bestDist = dist; best = l; }
    }
    return best || lectures.list[0];
  }

  function pickThisWeek(lectures, now, curatedSlugs) {
    if (Array.isArray(curatedSlugs) && curatedSlugs.length) {
      const arr = curatedSlugs.map(s => lectures.bySlug[s]).filter(Boolean);
      if (arr.length) return arr.slice(0, 3);
    }
    const ww = weekWindow(now);
    const year = now.getUTCFullYear();
    const inWeek = lectures.list
      .filter(l => l.dateParts && inWeekByMonthDay(l.dateParts, ww, year))
      .sort((a,b) => (b.dateParts?.y||0) - (a.dateParts?.y||0));
    if (inWeek.length) return inWeek.slice(0, 3);
    // Fallback: pick top 3 most recent by actual date
    const dated = lectures.list.filter(l => l.dateParts).sort((a,b) => b.dateParts.dt - a.dateParts.dt);
    return dated.slice(0, 3);
  }

  function renderLectureCard(lecture) {
    const dateStr = lecture.dateParts?.dt ? new Date(lecture.dateParts.dt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    const speakers = (lecture.speakers || []).slice(0,2).map(s => s.name).join(', ');
    const moreCount = (lecture.speakers || []).length > 2 ? ` +${(lecture.speakers||[]).length - 2}` : '';
    return `
      <div class="lecture-card">
        <div class="lecture-card-image" style="background: linear-gradient(135deg, var(--color-${lecture.supercategory}), var(--color-${lecture.supercategory}-light));">
          ${lecture.image_id ? `<img src="{{ '/assets/images/sm/' | relative_url }}${lecture.image_id}.webp" alt="${lecture.title}" onerror="this.style.display='none'">` : ''}
          <span class="lecture-card-category">${lecture.supercategory}</span>
        </div>
        <div class="lecture-card-content">
          <h3 class="lecture-card-title"><a href="{{ '/lecture/' | relative_url }}?slug=${lecture.slug}">${lecture.title}</a></h3>
          ${speakers ? `<div class="lecture-card-speakers">${speakers}${moreCount}</div>` : ''}
          ${lecture.synopsis ? `<p class="lecture-card-synopsis">${lecture.synopsis.substring(0, 120)}...</p>` : ''}
          <div class="lecture-card-meta"><span>${dateStr}</span></div>
        </div>
      </div>`;
  }

  function renderWeekList(lectures) {
    const items = lectures.map(l => `
      <li>
        <a href="{{ '/lecture/' | relative_url }}?slug=${l.slug}">${l.title}</a>
        <span class="week-item-meta">${l.dateParts ? new Date(l.dateParts.dt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : ''}</span>
      </li>
    `).join('');
    return `
      <div class="week-card">
        <ul class="week-list">${items}</ul>
      </div>
    `;
  }

  Promise.all([
    fetch('{{ site.baseurl }}/assets/data/lectures.json').then(r => r.json()),
    fetch('{{ site.baseurl }}/assets/data/home_highlights.json').then(r => r.json()).catch(() => ({ }))
  ])
  .then(([lectures, highlights]) => {
    const list = lectures.map(l => ({
      ...l,
      dateParts: parseDate(l.date || '')
    }));
    const bySlug = Object.fromEntries(list.map(l => [l.slug, l]));
    const now = getNowDate();

    const editorsPick = (highlights.editors_pick && highlights.editors_pick.slug && bySlug[highlights.editors_pick.slug])
      ? bySlug[highlights.editors_pick.slug]
      : list.filter(l => l.image_id && l.dateParts).sort((a,b) => b.dateParts.dt - a.dateParts.dt)[0] || list[0];

    const todayPick = pickToday({ list, bySlug }, now, highlights.today || null);
    const weekPicks = pickThisWeek({ list, bySlug }, now, highlights.this_week || []);

    function toISODate(d) {
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth()+1).padStart(2,'0');
      const da = String(d.getUTCDate()).padStart(2,'0');
      return `${y}-${m}-${da}`;
    }

    const nowISO = toISODate(now);
    const mainWeek = weekPicks[0];
    const weekMoreCount = Math.max(0, weekPicks.length - 1);

    const html = `
      <article class="highlight">
        <h3 class="highlight-label">Editor's pick</h3>
        ${renderLectureCard(editorsPick)}
        ${highlights.editors_pick && highlights.editors_pick.blurb ? `<p class=\"highlight-blurb\">${highlights.editors_pick.blurb}</p>` : ''}
      </article>
      <article class="highlight">
        <h3 class="highlight-label">Go today</h3>
        ${renderLectureCard(todayPick)}
      </article>
      <article class="highlight">
        <h3 class="highlight-label">Go this week</h3>
        ${mainWeek ? renderLectureCard(mainWeek) : ''}
        ${weekMoreCount > 0 ? `<div class=\"week-more\"><a href=\"{{ '/browse/' | relative_url }}?now=${encodeURIComponent(nowISO)}#this-week\">+${weekMoreCount} more this week</a></div>` : ''}
      </article>
    `;
    highlightsGrid.innerHTML = html;
  })
  .catch(err => {
    console.error('Error loading highlights:', err);
    highlightsGrid.innerHTML = '<p>Error loading highlights.</p>';
  });
})();

</script>

<style>
  .highlights { margin: 2rem 0; }
  .highlights-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.5rem;
  }
  .highlight .highlight-label {
    margin: 0 0 .5rem;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-muted, #666);
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .highlight .highlight-blurb { margin-top: .5rem; }
  .week-card { padding: .5rem 0; }
  .week-list { list-style: none; padding: 0; margin: 0; }
  .week-list li { display: flex; justify-content: space-between; padding: .4rem 0; border-bottom: 1px solid #eee; }
  .week-list li:last-child { border-bottom: 0; }
  .week-item-meta { color: var(--text-muted, #666); margin-left: 1rem; }
  .week-more { margin-top: .5rem; }
  .week-more a { color: var(--link-color, #0b5fff); text-decoration: none; font-weight: 600; }
  .week-more a:hover { text-decoration: underline; }
  @media (max-width: 900px) {
    .highlights-grid { grid-template-columns: 1fr; }
  }
</style>

<style>
.recent-lectures {
  padding: var(--spacing-xxl) 0;
}

/* Recent lecture card image with gradient fallback */
.lecture-card-image {
  position: relative;
  height: 140px;
  overflow: hidden;
  border-radius: 8px 8px 0 0;
}
.lecture-card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
</style>
