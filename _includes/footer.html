<footer class="site-footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-section">
        <h3>{{ site.title }}</h3>
        <p>{{ site.description }}</p>
      </div>
      
      <div class="footer-section">
        <h4>Explore</h4>
        <ul>
          <li><a href="{{ '/browse/' | relative_url }}">Browse Lectures</a></li>
          <li><a href="{{ '/topics/' | relative_url }}">Topics</a></li>
          <li><a href="{{ '/speakers/' | relative_url }}">Speakers</a></li>
        </ul>
      </div>
      
      <div class="footer-section">
        <h4>About</h4>
        <ul>
          <li><a href="{{ '/about/' | relative_url }}">About This Archive</a></li>
          <li><a href="{{ '/feed.xml' | relative_url }}">RSS Feed</a></li>
        </ul>
      </div>
      
      <div class="footer-section">
        <h4>Statistics</h4>
        <ul>
          <li><span id="footer-lecture-count">…</span> Lectures</li>
          <li><span id="footer-speaker-count">…</span> Speakers</li>
          <li><span id="footer-topic-count">…</span> Topics</li>
        </ul>
      </div>
    </div>
    
    <div class="footer-bottom">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. Archive of lectures from 2003-2018.</p>
    </div>
  </div>
</footer>
<script>
  (function() {
    const url = '{{ "/assets/data/summary.json" | relative_url }}';
    fetch(url)
      .then(function(resp) { return resp.ok ? resp.json() : null; })
      .then(function(summary) {
        if (!summary) return;
        var fmt = function(n){ try { return Number(n).toLocaleString(); } catch(e) { return n; } };
        var el;
        el = document.getElementById('footer-lecture-count');
        if (el && summary.total_lectures != null) el.textContent = fmt(summary.total_lectures);
        el = document.getElementById('footer-speaker-count');
        if (el && summary.total_speakers != null) el.textContent = fmt(summary.total_speakers);
        el = document.getElementById('footer-topic-count');
        if (el && summary.total_topics != null) el.textContent = fmt(summary.total_topics);
      })
      .catch(function() { /* silent fail */ });
  })();
  </script>
